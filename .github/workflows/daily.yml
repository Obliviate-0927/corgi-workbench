name: 每日资讯快报

on:
  schedule:
    # UTC 0:00 = 北京时间 08:00（中国全年 UTC+8，无夏令时）
    - cron: '0 0 * * *'
  workflow_dispatch: {}   # 允许在 Actions 页面手动点一下立即运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 抓取最新快报 + 报税期限
        run: |
          node fetch-news.js
          node fetch-taxdue.js
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json taxdue.json
          if git diff --cached --quiet; then echo "无变化，跳过"; else git commit -m "自动更新快报与报税期限 $(date +%F)"; git push; fi
